server.port=0
spring.application.name=notification-service
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/


# kafka config
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=notificationTopic
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=event:com.notificationservice.event.OrderPlacedEvent
spring.kafka.consumer.group-id=notificationId

# actuator
management.endpoints.web.exposure.include=prometheus